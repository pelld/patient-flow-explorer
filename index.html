<!DOCTYPE html>
<html lang="en-GB">
<head>
    <!-- ===================================================================
         00A. PAGE METADATA
         =================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plain-language evidence statements about changes to health services and the outcomes associated with them.">
    <title>Health System Levers</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- ===================================================================
         00B. WIDE PAGE SHELL
         =================================================================== -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Health System Levers</h1>
                <p>What does the evidence say?</p>
            </div>

            <nav class="page-nav" aria-label="Page navigation">
                <span class="page-nav__current">Evidence statements</span>
                <a href="method/">How scores work</a>
                <a href="pathway/">Patient pathway model</a>
            </nav>
        </header>

        <!-- ===============================================================
             01A. SIMPLE SCORE KEY
             =============================================================== -->
        <section class="score-key" aria-label="Score key">
            <div class="score-key__group">
                <strong>Association</strong>
                <span class="key-chip key-chip--association-strong">Strong</span>
                <span class="key-chip key-chip--association-moderate">Moderate</span>
                <span class="key-chip key-chip--association-weak">Weak</span>
                <span class="key-chip key-chip--association-none">None</span>
                <span class="key-chip key-chip--association-unknown">Unknown</span>
            </div>

            <div class="score-key__group">
                <strong>Evidence</strong>
                <span class="key-chip key-chip--evidence-high">4/4 High</span>
                <span class="key-chip key-chip--evidence-moderate">3/4 Moderate</span>
                <span class="key-chip key-chip--evidence-low">2/4 Low</span>
                <span class="key-chip key-chip--evidence-very-low">1/4 Very low</span>
            </div>
        </section>

        <!-- ===============================================================
             02A. EVIDENCE STATEMENT GRID
             =============================================================== -->
        <section class="statement-grid" id="statement-grid" aria-label="Health service evidence statements"></section>
    </main>

    <!-- ===================================================================
         03A. SHARED EVIDENCE TOOLTIP
         =================================================================== -->
    <div class="evidence-tooltip" id="evidence-tooltip" role="dialog" aria-modal="false" aria-labelledby="tooltip-title" hidden>
        <button class="tooltip-close" id="tooltip-close" type="button" aria-label="Close evidence">×</button>
        <div id="tooltip-content"></div>
    </div>

    <!-- ===================================================================
         04A. DATA AND APPLICATION SCRIPTS
         =================================================================== -->
    <script src="data/evidence.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
